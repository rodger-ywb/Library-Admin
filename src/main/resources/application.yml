server:
  port: 8080

spring:
  application:
    name: book-admin-backend
  datasource:
    url: jdbc:mysql://localhost:3306/book_admin?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: admin
    password: rodger123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      # 生产环境建议 none，并提前执行 sql/init.sql 建表；开发环境可用 update 自动建表
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 业务与安全配置
app:
  jwt:
    # 生产环境务必替换为随机长密钥（至少 256 位 / 32 字符以上）
    secret: change-me-to-a-random-secret-key-at-least-32-chars-long-0123456789abcdef
    expire-seconds: 86400
    header: Authorization
    prefix: "Bearer "
  import:
    # 分批写入大小
    batch-size: 100
    # 导入预览缓存保留时间（秒）
    preview-expire-seconds: 1800
  admin:
    # 首次启动自动创建的管理员账号（生产环境请立即修改密码）
    username: admin
    password: admin123
    display-name: 系统管理员
    # 用户管理白名单：仅这些用户名可在前端看到并操作用户管理页面（逗号分隔多个）
    user-manager-whitelist: admin
  h5-rate-limit:
    # H5 只读接口防刷：每 IP 每接口每分钟最大请求数
    per-minute: 120

logging:
  level:
    com.library.bookadmin: info
    org.springframework.security: warn
